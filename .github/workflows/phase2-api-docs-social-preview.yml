name: Prepare API Docs social preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/phase2-api-docs-social-preview.yml"
      - "src/routes/docs.js"
      - "test/docs-interface.test.js"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-phase2-api-docs-social-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/api-docs-social-preview-card'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prove the central API Docs card is live
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://atlas-systems.uk/og/api-docs.png \
            --output "${RUNNER_TEMP}/api-docs.png"
          CARD_PATH="${RUNNER_TEMP}/api-docs.png" python3 - <<'PY'
          import os
          import struct
          from pathlib import Path
          data = Path(os.environ["CARD_PATH"]).read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("API Docs card is not a PNG")
          if struct.unpack(">II", data[16:24]) != (1200, 630):
              raise SystemExit("API Docs card is not 1200x630")
          PY

      - name: Materialize API Docs metadata and tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          docs = Path("src/routes/docs.js")
          source = docs.read_text(encoding="utf-8")
          old_card = "https://atlas-systems.uk/og-default.png"
          new_card = "https://atlas-systems.uk/og/api-docs.png"
          if source.count(old_card) != 2:
              raise SystemExit("expected exactly two generic API Docs card references")
          source = source.replace(old_card, new_card)
          old_alt = '<meta property="og:image:alt" content="Atlas Systems public API documentation">'
          new_alt = '<meta property="og:image:alt" content="The Atlas Systems API. // Atlas Systems">'
          if source.count(old_alt) != 1:
              raise SystemExit("expected the existing API Docs Open Graph alt tag")
          source = source.replace(old_alt, new_alt)
          twitter_image = f'<meta name="twitter:image" content="{new_card}">'
          twitter_alt = '<meta name="twitter:image:alt" content="The Atlas Systems API. // Atlas Systems">'
          if twitter_alt not in source:
              if source.count(twitter_image) != 1:
                  raise SystemExit("expected one API Docs Twitter image tag")
              source = source.replace(twitter_image, f"{twitter_image}\n{twitter_alt}")
          docs.write_text(source, encoding="utf-8")

          tests = Path("test/docs-interface.test.js")
          suite = tests.read_text(encoding="utf-8")
          anchor = '  assert.match(html, /property="og:image:alt"/);\n'
          addition = '''  assert.match(html, /property="og:image" content="https:\\/\\/atlas-systems\\.uk\\/og\\/api-docs\\.png"/);\n  assert.match(html, /name="twitter:image" content="https:\\/\\/atlas-systems\\.uk\\/og\\/api-docs\\.png"/);\n  assert.match(html, /property="og:image:alt" content="The Atlas Systems API\\. \\/\\/ Atlas Systems"/);\n  assert.match(html, /name="twitter:image:alt" content="The Atlas Systems API\\. \\/\\/ Atlas Systems"/);\n'''
          if addition not in suite:
              if suite.count(anchor) != 1:
                  raise SystemExit("could not locate API Docs metadata test anchor")
              suite = suite.replace(anchor, addition)
          tests.write_text(suite, encoding="utf-8")
          PY

      - name: Validate generated source
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run verify:docs-interface
          git diff --check

      - name: Commit generated source
        run: |
          set -euo pipefail
          git add src/routes/docs.js test/docs-interface.test.js
          if git diff --cached --quiet
          then
            echo "API Docs metadata is already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use the API Docs social preview card"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
