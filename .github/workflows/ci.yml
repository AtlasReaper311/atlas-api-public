name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate deterministic local docs assets
        run: |
          set -euo pipefail
          npm run verify:docs-interface
          npm run build:docs-interface
          npm run build:docs-icons
          git diff --exit-code -- \
            src/routes/docs-interface.generated.js \
            src/routes/docs-icons.generated.js
      - name: Lint
        run: npm run lint
      - name: Generate public topology evidence projection
        run: |
          node scripts/project-public-topology-evidence.mjs \
            --write \
            evidence/topology/2026-07-22T102913Z.json \
            data/estate.manifest.json \
            data/public-repository-classifications.json \
            /tmp/public-topology-evidence.json
      - name: Verify public topology evidence projection
        run: |
          diff -u \
            data/public-topology-evidence.json \
            /tmp/public-topology-evidence.json
      - name: Upload generated topology projection on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-public-topology-evidence
          path: /tmp/public-topology-evidence.json
          retention-days: 1
      - name: Run Trace unit tests
        run: |
          node --test \
            test/topology-evidence.test.js \
            test/trace.test.js
      - name: Run tests
        run: |
          set +e
          npm test > /tmp/atlas-api-public-tests.log 2>&1
          TEST_STATUS=$?
          cat /tmp/atlas-api-public-tests.log
          exit "$TEST_STATUS"
      - name: Upload failing unit-test output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-api-public-test-output
          path: /tmp/atlas-api-public-tests.log
          retention-days: 1
      - name: Build exact Wrangler deployment candidate
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Check out pinned Atlas Infra Worker contract validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
        with:
          repository: AtlasReaper311/atlas-infra
          ref: f971172dc258c93dffa53b8b7a3532c5be55883d
          path: .atlas-infra-contracts
          persist-credentials: false
      - name: Validate bundled Worker contracts
        run: |
          python3 .atlas-infra-contracts/scripts/worker_contract.py check \
            --bundle-dir dist \
            --require-meta \
            --require-openapi
      - name: Check out Atlas Infra classification authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
        with:
          repository: AtlasReaper311/atlas-infra
          ref: main
          path: .classification-authority
          sparse-checkout: policy/public-repository-classifications.json
          sparse-checkout-cone-mode: false
      - name: Verify repository classification projection
        run: |
          node scripts/verify-repository-classifications.mjs \
            data/public-repository-classifications.json \
            .classification-authority/policy/public-repository-classifications.json
      - name: Resolve pinned ADR Trace authority SHA
        id: adr_pin
        run: |
          set -euo pipefail
          sha="$(node -e 'const pin=require("./data/adr-trace-authority.json"); if(!/^[0-9a-f]{40}$/.test(pin.authority_sha||"")) process.exit(1); process.stdout.write(pin.authority_sha)')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Check out exact Atlas Infra ADR Trace authority
        # Pin lives in data/adr-trace-authority.json and must match data/adr-runtime-index.json.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
        with:
          repository: AtlasReaper311/atlas-infra
          ref: ${{ steps.adr_pin.outputs.sha }}
          path: .trace-authority
          persist-credentials: false
      - name: Verify ADR runtime projection
        run: |
          python3 .trace-authority/scripts/adr_trace.py emit \
            --root .trace-authority \
            --output /tmp/adr-runtime-index.json
          node scripts/verify-adr-runtime-index.mjs \
            data/adr-runtime-index.json \
            /tmp/adr-runtime-index.json
          test "$(node -e 'process.stdout.write(require("./data/adr-trace-authority.json").authority_sha)')" = "${{ steps.adr_pin.outputs.sha }}"

  # CI result reported through the reusable atlas-notify workflow:
  # routes to #ci-cd via signal_class, failures mirror to #alerts.
  notify:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: AtlasReaper311/atlas-notify/.github/workflows/notify.yml@4485013d9a432d4759ce025fa9bc73aa6a2d9c7f # atlas-notify main: channel routing
    with:
      status: ${{ needs.test.result }}
      kind: ci
      signal_class: cicd
    secrets:
      NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
